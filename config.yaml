# ============================================================
# Sleep Stage Classification — Configuration
# Model: SleepStager (CNN)
# Dataset: PhysioNet Sleep EDF 
#
# Contains data paths, model architecture hyperparameters, training settings,
# and MLflow configuration.
#
# Author: Kartik M. Jalal
# Last Update: 04-08-2026
# ============================================================

data:
  dir:
    root: "./data"                                    # Root dir for raw PhysioNet EDF downloads
    filtered: "./data/sleep_physionet_data_filtered"  # Band-pass filtered (0.5–30 Hz) data
    ica_cleaned: "./data/sleep_physionet_data_ica"    # ICA artifact-cleaned data
  
  digital_signal:
    epoch_duration: 30.0  # Duration (sec) of each digital signal epoch window (AASM standard)
                          # → determines input tensor shape: (1, 3, duration × 100 Hz)

  dataset:
    test_subjects_pct: 0.2  # Fraction of subjects held out for testing  (subject-wise split)
    val_subjects_pct: 0.2   # Fraction of subjects held out for validation
    train_batch_size: 64    # Epochs per training batch — smaller = noisier gradients, helps with class imbalance
    val_batch_size: 256     # Epochs per eval batch — larger since no gradients stored; power-of-2 for GPU alignment

model:
  architecture:
    n_spatial_filters: 8       # Spatial conv filters — learns virtual electrode combinations
                               # from the 3 physical channels (Fpz-Cz EEG, Pz-Oz EEG, EOG);
                               # 8 gives enough capacity for the added EOG channel
    n_temporal_filters_l1: 16  # 1st temporal conv layer filter count — captures low-level patterns
                               # like spindles, K-complexes, and eye movements
    n_temporal_filters_l2: 32  # 2nd temporal conv layer filter count — wider than L1 to combine
                               # low-level features into higher-level representations
    temp_conv_size_sec: 0.55   # Temporal kernel width in seconds (→ 55 samples at 100 Hz);
                               # 0.55s matches typical spindle/K-complex duration
    max_pool_size_sec: 0.25    # Max-pool window in seconds (→ 25 samples at 100 Hz);
                               # gentler downsampling preserves temporal detail for hard classes (N1)
    dropout_rate: 0.35         # Dropout probability before final dense layer

  optimiser:
    type: "AdamW"
    lr: 1e-4            # Learning rate
    weight_decay: 1e-3  # L2 regularization penalty

  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"      # Monitor direction — reduce LR when val loss stops decreasing
    factor: 0.15     # Multiplier on LR reduction (new_lr = lr × 0.15)
    patience: 7      # Epochs before LR reduction
    threshold: 1e-4  # Minimum val loss change to count as improvement; sensitive to small gains

  training:
    n_epochs: 200                # Maximum training epochs (may stop earlier)
    early_stopping_patience: 15  # Stop if val loss doesn't improve — 15 is enough with gentler scheduler
    max_grad_norm: 1.0           # Gradient clipping norm — prevents exploding gradients

mlflow:
  tracking_uri: Null                # MLflow server URL (to start the server run: mlflow server -p 5000) and replace Null with "http://localhost:5000" when running
  experiment_name: "Sleep_Staging"  # Groups related runs together
  run_name: "SleepStager"           # Label for this specific run
